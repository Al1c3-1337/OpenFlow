name: openflow
description: Shared Android and iOS client for the Flow headset.
publish_to: none
version: 0.0.3+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: 5.6.0
  nordic_dfu: 8.1.0
  permission_handler: 13.0.2
  device_info_plus: 13.3.0
  file_picker: 13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

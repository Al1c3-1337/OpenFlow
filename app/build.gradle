plugins {
    id 'com.android.application'
}

android {
    namespace = 'de.al1c3.openflow'
    compileSdk = 37

    defaultConfig {
        applicationId = 'de.al1c3.openflow'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled = false
        }
    }
}

dependencies {
    // Nordic's official DFU library (Maven Central, BSD-3-Clause) -- the library that the companion
    // app's Laerdal.Dfu binding wraps. It pulls a few AndroidX transitive deps, which is why
    // android.useAndroidX=true is set in gradle.properties. Adjust the version as needed.
    implementation 'no.nordicsemi.android:dfu:2.11.0'
}

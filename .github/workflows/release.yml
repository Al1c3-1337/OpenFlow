name: Build Flutter release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: Validate release and shared app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release version and signing setup
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use vX.Y.Z, for example v0.0.3."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          # Monotonic across releases and above the former Java app's versionCode.
          echo "build_number=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Signed Flutter Android release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflow-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/openflow-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=OPENFLOW_DEMO=false
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openflow-release.keystore"
      - name: Verify and name Android release asset
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p build/release
          cp "$APK" "build/release/openflow-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: mobile/build/release/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Unsigned iPhone release
    needs: check
    runs-on: macos-26
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build iPhone app without signing
        run: flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=OPENFLOW_DEMO=false
      - name: Package unsigned iPhone release asset
        run: |
          test -f build/ios/iphoneos/Runner.app/Runner
          test ! -f build/ios/iphoneos/Runner.app/_CodeSignature/CodeResources
          test ! -f build/ios/iphoneos/Runner.app/embedded.mobileprovision
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "build/release/openflow-$VERSION-ios-UNSIGNED.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: mobile/build/release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach both apps to the release
    needs: [check, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Upload the verified release builds
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/openflow-$VERSION-android.apk" \
            "release/openflow-$VERSION-ios-UNSIGNED.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
